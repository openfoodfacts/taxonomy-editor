# Add labels to any pull request with changes to the specified paths
# for reference, see https://github.com/actions/labeler

GitHub:
  - changed-files:
      - any-glob-to-any-file: ".github/**/*"

📚 documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "LICENSE"
          - "doc/**/*"

🐳 Docker:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile"
          - "**/Dockerfile"
          - "docker-compose.yml"
          - "docker/**/*"

backend:
  - changed-files:
      - any-glob-to-any-file: "backend/**/*"

frontend:
  - changed-files:
      - any-glob-to-any-file: "taxonomy-editor-frontend/**/*"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "**/package.json"
          - "**/package-lock.json"
          - "**/pyproject.toml"
          - "**/poetry.lock"
          - ".github/workflows/actions.lock"

api:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/editor/api.py"
          - "backend/editor/controllers/**/*"
          - "backend/openapi/**/*"
          - "taxonomy-editor-frontend/src/client/**/*"

OpenAPI:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/openapi/**/*"
          - "taxonomy-editor-frontend/src/client/**/*"

nginx:
  - changed-files:
      - any-glob-to-any-file: "conf/**/*"

neo4j:
  - changed-files:
      - any-glob-to-any-file:
          - "neo4j/**/*"
          - "backend/editor/graph_db.py"

parser:
  - changed-files:
      - any-glob-to-any-file: "parser/**/*"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/tests/**/*"
          - "parser/tests/**/*"

python:
  - changed-files:
      - any-glob-to-any-file: "**/*.py"

js:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.js"
          - "**/*.ts"
          - "**/*.tsx"
          - "**/*.jsx"

devops:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**/*"
          - "Dockerfile"
          - "**/Dockerfile"
          - "docker-compose.yml"
          - "docker/**/*"
          - "conf/**/*"
          - "Makefile"
          - "**/Makefile"

fastapi:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/editor/api.py"
          - "backend/editor/controllers/**/*"
          - "backend/editor/models/**/*"
          - "backend/editor/scheduler.py"

database:
  - changed-files:
      - any-glob-to-any-file:
          - "neo4j/**/*"
          - "backend/editor/graph_db.py"

checks:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/lint-commands.yml"
          - ".github/workflows/pull_request.yml"
          - ".github/workflows/codeql.yml"
          - ".github/workflows/dependency-review.yml"
          - ".github/workflows/semantic-pr.yml"
          - ".prettierrc.json"
          - ".prettierignore"
          - "taxonomy-editor-frontend/.eslintrc.json"
          - "taxonomy-editor-frontend/.prettierrc.json"
          - "taxonomy-editor-frontend/.husky/**/*"
          - "backend/setup.cfg"
          - "parser/setup.cfg"

translations:
  - changed-files:
      - any-glob-to-any-file:
          - "taxonomy-editor-frontend/src/pages/project/editentry/ListTranslations.tsx"
          - "taxonomy-editor-frontend/src/pages/project/editentry/TranslationTags.*"

search:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/editor/controllers/search_controller.py"
          - "backend/editor/models/search_models.py"
          - "taxonomy-editor-frontend/src/pages/project/search/**/*"
          - "taxonomy-editor-frontend/src/client/models/*FilterSearchTerm.ts"
          - "taxonomy-editor-frontend/src/client/models/EntryNodeSearchResult.ts"

export:
  - changed-files:
      - any-glob-to-any-file:
          - "parser/rdf_export/**/*"
          - "backend/tests/test_export.py"
          - "taxonomy-editor-frontend/src/pages/project/export/**/*"

Property edition:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/editor/controllers/node_controller.py"
          - "taxonomy-editor-frontend/src/pages/project/editentry/**/*"

PR generation:
  - changed-files:
      - any-glob-to-any-file: "backend/editor/github_functions.py"

error handling:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/editor/exceptions.py"
          - "parser/openfoodfacts_taxonomy_parser/parser/exception.py"
          - "taxonomy-editor-frontend/src/pages/project/errors/**/*"

home page:
  - changed-files:
      - any-glob-to-any-file:
          - "taxonomy-editor-frontend/src/pages/home/**/*"
          - "taxonomy-editor-frontend/src/components/ResponsiveAppBar.tsx"
